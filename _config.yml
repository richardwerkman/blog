# Site settings
title: Richard Werkman
description: "Blog & Portfolio of Richard Werkman"
baseurl: "/blog"
url: "https://richardwerkman.github.io"

# Theme
theme: jekyll-theme-chirpy

# Author settings
author:
   name: Richard Werkman
   url: https://github.com/richardwerkman
   bio: "Developer & Blogger"

github:
   username: richardwerkman

# Social links
social:
   name: Richard Werkman
   links:
     - https://github.com/richardwerkman

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Locale
locale: en

# Date format
date_format: "%Y-%m-%d"

# Compress settings
compress_html:
  ignore:
    envs:
      - development

# Build settings
exclude:
  - "*.gemspec"
  - LICENSE
  - README.md
  - Gemfile
  - Gemfile.lock
