<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="470" viewBox="0 0 1090 470" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1090" height="470" rx="12" fill="#f8fafc"/>
  <text x="545" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">oMLX tiered caching</text>

  <!-- 1. Prompt -->
  <rect x="30" y="80" width="220" height="130" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="140" y="115" text-anchor="middle" font-size="18" font-weight="700" fill="#075985">1. Prompt</text>
  <text x="140" y="145" text-anchor="middle" font-size="13" fill="#0f172a">System prompt + history</text>
  <text x="140" y="165" text-anchor="middle" font-size="13" fill="#0f172a">+ new message</text>
  <text x="140" y="192" text-anchor="middle" font-size="12" fill="#475569">split into prefix blocks</text>

  <!-- 2. KV cache -->
  <rect x="300" y="80" width="220" height="130" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="410" y="115" text-anchor="middle" font-size="18" font-weight="700" fill="#9d174d">2. KV cache</text>
  <text x="410" y="145" text-anchor="middle" font-size="13" fill="#0f172a">Attention keys and values</text>
  <text x="410" y="165" text-anchor="middle" font-size="13" fill="#0f172a">computed per token (prefill)</text>
  <text x="410" y="192" text-anchor="middle" font-size="12" fill="#475569">the data being cached</text>

  <!-- 3. Memory cache -->
  <rect x="570" y="80" width="220" height="130" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="680" y="115" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">3. Memory cache</text>
  <text x="680" y="145" text-anchor="middle" font-size="13" fill="#0f172a">Unified memory (RAM)</text>
  <text x="680" y="165" text-anchor="middle" font-size="13" fill="#0f172a">Hot KV blocks, fastest access</text>
  <text x="680" y="192" text-anchor="middle" font-size="12" fill="#475569">size limit (default 0)</text>

  <!-- 4. SSD cache -->
  <rect x="840" y="80" width="220" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="950" y="115" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">4. SSD cache</text>
  <text x="950" y="145" text-anchor="middle" font-size="13" fill="#0f172a">Paged KV blocks on disk</text>
  <text x="950" y="165" text-anchor="middle" font-size="13" fill="#0f172a">Cold blocks, large capacity</text>
  <text x="950" y="192" text-anchor="middle" font-size="12" fill="#475569">size limit (configurable)</text>

  <!-- Prompt -> KV -->
  <line x1="252" y1="145" x2="298" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="275" y="132" text-anchor="middle" font-size="12" fill="#334155">prefill</text>

  <!-- KV -> Memory -->
  <line x1="522" y1="145" x2="568" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="545" y="132" text-anchor="middle" font-size="12" fill="#334155">store</text>

  <!-- Memory -> SSD -->
  <line x1="792" y1="125" x2="838" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="815" y="112" text-anchor="middle" font-size="12" fill="#334155">spill</text>

  <!-- SSD -> Memory -->
  <line x1="838" y1="170" x2="792" y2="170" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="815" y="188" text-anchor="middle" font-size="12" fill="#334155">restore</text>

  <!-- Explainer -->
  <rect x="30" y="240" width="1030" height="105" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="268" font-size="15" font-weight="700" fill="#0f172a">KV cache vs. memory cache</text>
  <text x="50" y="294" font-size="13" fill="#0f172a"><tspan font-weight="700" fill="#9d174d">KV cache</tspan> = the data. The keys and values the model computes for every token, so it never has to re-read the prompt.</text>
  <text x="50" y="317" font-size="13" fill="#0f172a"><tspan font-weight="700" fill="#92400e">Memory cache</tspan> = the place. A fast RAM tier that holds blocks of KV cache, and spills them to the SSD cache when full.</text>
  <text x="50" y="337" font-size="12" fill="#475569">With the memory cache at 0, blocks go straight to SSD and every reuse is a reload from disk.</text>

  <!-- Outcomes -->
  <text x="545" y="388" text-anchor="middle" font-size="14" fill="#0f172a"><tspan font-weight="700" fill="#166534">Hit</tspan> in memory or SSD cache: reuse the KV blocks, skip prefill (time to first token 1-3 s)</text>
  <text x="545" y="414" text-anchor="middle" font-size="14" fill="#0f172a"><tspan font-weight="700" fill="#b91c1c">Miss</tspan> in both: recompute the KV cache (time to first token 30-90 s), then store it</text>
</svg>
